name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "自定义镜像标签（可选，留空则自动按分支/语义化版本打标，如 v3.0.1）"
        required: false
        default: ""
      platforms:
        description: "编译构建的目标架构平台"
        required: true
        type: choice
        default: "linux/amd64,linux/arm64"
        options:
          - "linux/amd64,linux/arm64"
          - "linux/amd64"
          - "linux/arm64"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Multi-Arch Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate custom image tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.custom_tag != ''
        env:
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          # 禁止覆盖保留标签，并限制为合法镜像标签字符集
          case "$CUSTOM_TAG" in
            latest|main|master|release|stable|edge|dev)
              echo "::error::禁止使用保留标签: $CUSTOM_TAG"; exit 1;;
          esac
          if ! printf '%s' "$CUSTOM_TAG" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::非法的镜像标签格式: $CUSTOM_TAG"
            exit 1
          fi

      - name: Verify pushed tag matches VERSION file
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          file_version="$(tr -d ' \r\n' < VERSION)"
          tag_version="${TAG_NAME#v}"
          if [ -z "$tag_version" ] || [ "$file_version" != "$tag_version" ]; then
            echo "::error::标签 ${TAG_NAME} 与 VERSION 文件内容 (${file_version}) 不一致"
            exit 1
          fi

      - name: Set up QEMU (Multi-platform linux/amd64 & linux/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

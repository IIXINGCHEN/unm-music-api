name: Auto Release

# 推送 v*.*.* 标签时自动创建 GitHub Release：
# 生成更新说明（--generate-notes）并附加 dist 构建产物压缩包
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release with Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version and build dist
        run: |
          node scripts/sync-version.mjs
          pnpm run build

      - name: Read version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack dist artifact
        run: |
          mkdir -p ./artifacts
          tar -czf "./artifacts/unm-server-dist-${GITHUB_REF_NAME}.tar.gz" \
            -C . dist package.json pnpm-lock.yaml README.md VERSION

      - name: Verify tag matches VERSION file
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          file_version="$(tr -d ' \r\n' < VERSION)"
          tag_version="${TAG_NAME#v}"
          if [ -z "$tag_version" ] || [ "$file_version" != "$tag_version" ]; then
            echo "::error::标签 ${TAG_NAME} 与 VERSION 文件内容 (${file_version}) 不一致，拒绝发布"
            exit 1
          fi

      - name: Verify tag object exists and points to a commit
        run: |
          # 说明：此处仅做标签对象存在性与指向校验。
          # 密码学签名验证依赖仓库设置中的 required signatures（网页端手动勾选），
          # 本地 git verify-tag 需要在 CI 注入签名公钥与 allowed_signers，暂未纳入自动化。
          git cat-file -e "${GITHUB_REF_NAME}^{}"

      # gh --verify-tag 语义仅为“远端标签必须已存在”，不做签名验证（见 cli.github.com/manual/gh_release_create）
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "UNM-Server ${GITHUB_REF_NAME}" \
            ./artifacts/unm-server-dist-${GITHUB_REF_NAME}.tar.gz

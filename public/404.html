<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 页面或资源未找到 · UNM-Server</title>
  <link rel="shortcut icon" href="./favicon.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- 构建期预编译 Tailwind（替代运行时 JIT） -->
  <link rel="stylesheet" href="/assets/css/tailwind.css" />
  <script src="/vendor/lucide.min.js"></script>

  <!-- 关键样式内联：首帧即正确底色 -->
  <style>
    html { background: #020617; color-scheme: dark; }
    body { -webkit-font-smoothing: antialiased; }
  </style>

  <link rel="stylesheet" href="/assets/css/404.css" />
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-500 mesh-gradient">

  <!-- 顶部精简导航 -->
  <header class="w-full max-w-5xl mx-auto px-6 py-8 flex items-center justify-between">
    <a href="/" class="flex items-center space-x-3 group">
      <div class="w-9 h-9 rounded-2xl bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800 flex items-center justify-center p-2 group-hover:scale-105 transition">
        <img src="./favicon.png" alt="Logo" class="w-full h-full object-contain" />
      </div>
      <span class="font-bold text-base text-slate-900 dark:text-white">UNM-Server</span>
    </a>

    <button id="themeToggle" class="w-9 h-9 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition shadow-sm">
      <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
      <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
    </button>
  </header>

  <!-- 404 主体内容区 (留白与现代卡片) -->
  <main class="w-full max-w-xl mx-auto px-6 py-12 flex-1 flex flex-col items-center justify-center text-center">
    <div class="glass-card bg-white/80 dark:bg-slate-900/60 p-10 sm:p-12 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-xl space-y-6 w-full">
      <div class="w-16 h-16 rounded-2xl bg-sky-500/10 dark:bg-sky-500/20 text-sky-500 flex items-center justify-center mx-auto shadow-sm">
        <i data-lucide="compass" class="w-8 h-8"></i>
      </div>

      <div class="space-y-2">
        <div class="text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white font-mono">404</div>
        <h1 class="text-xl font-bold text-slate-800 dark:text-slate-200">所请求的资源或路径不存在</h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 max-w-sm mx-auto leading-relaxed">
          请检查请求的 API 端点或 URL 路径是否正确。
        </p>
      </div>

      <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3">
        <a href="/" class="w-full sm:w-auto inline-flex items-center justify-center space-x-2 px-6 py-3 rounded-2xl bg-slate-900 hover:bg-sky-600 dark:bg-white dark:hover:bg-sky-400 text-white dark:text-slate-900 font-semibold text-sm transition shadow-sm">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>返回服务首页</span>
        </a>
        <a href="/info" class="w-full sm:w-auto inline-flex items-center justify-center space-x-2 px-6 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-200 font-semibold text-sm hover:bg-slate-200 dark:hover:bg-slate-700 transition">
          <i data-lucide="info" class="w-4 h-4"></i>
          <span>查看服务状态</span>
        </a>
      </div>
    </div>
  </main>

  <!-- 底部 Footer -->
  <footer class="w-full max-w-5xl mx-auto px-6 py-8 text-center text-xs text-slate-400 border-t border-slate-200/60 dark:border-slate-800/60">
    <div>Copyright &copy; <span id="year"></span> UNM-Server · All Rights Reserved</div>
  </footer>

  <!-- 页面逻辑：主题切换 -->
  <script src="/assets/js/404.js"></script>
</body>
</html>

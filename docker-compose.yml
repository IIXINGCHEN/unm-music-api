services:
  unm-server:
    container_name: unm-server
    image: hoolhub/unm-server:4.5.0
    build:
      context: .
      dockerfile: Dockerfile
    # 每次 up 都先按当前源码重新构建镜像，避免旧镜像导致前端与源码不一致
    # （否则 docker compose up -d 会直接复用已存在的旧镜像）
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=5678
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - unm-network

networks:
  unm-network:
    driver: bridge

services:
  unm-server:
    container_name: unm-server
    image: ghcr.io/iixingchen/unm-music-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 端口发布地址使用独立变量 BIND_HOST，**不复用 HOST**。
      # HOST 在 .env.example 里被文档化为「服务监听地址」（如需暴露公网可设为 0.0.0.0），
      # 且下方 environment 又把它强制为 0.0.0.0；若此处再用 ${HOST}，任何按文档设置
      # HOST=0.0.0.0 的部署都会把端口静默发布到全部网络接口（而非仅回环），
      # 与「默认不对外暴露」的意图相反。
      - "${BIND_HOST:-127.0.0.1}:${PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=5678
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - unm-network

networks:
  unm-network:
    driver: bridge

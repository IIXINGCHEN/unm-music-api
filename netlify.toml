[build]
  publish = "public"
  functions = "netlify/functions"
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

# 函数打包配置：UNM 引擎改为静态 import，由 esbuild 完整打包进 bundle
[functions]
  node_bundler = "esbuild"

# 1. 静态资源直通规则
[[redirects]]
  from = "/favicon.png"
  to = "/favicon.png"
  status = 200

# 2. 核心 API 路由重写至 Netlify Functions
[[redirects]]
  from = "/info"
  to = "/.netlify/functions/api/info"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/ping"
  to = "/.netlify/functions/api/ping"
  status = 200

[[redirects]]
  from = "/test"
  to = "/.netlify/functions/api/test"
  status = 200

[[redirects]]
  from = "/match"
  to = "/.netlify/functions/api/match"
  status = 200

[[redirects]]
  from = "/ncmget"
  to = "/.netlify/functions/api/ncmget"
  status = 200

[[redirects]]
  from = "/otherget"
  to = "/.netlify/functions/api/otherget"
  status = 200

[[redirects]]
  from = "/search"
  to = "/.netlify/functions/api/search"
  status = 200

[[redirects]]
  from = "/pic"
  to = "/.netlify/functions/api/pic"
  status = 200

[[redirects]]
  from = "/picture"
  to = "/.netlify/functions/api/picture"
  status = 200

[[redirects]]
  from = "/lyric"
  to = "/.netlify/functions/api/lyric"
  status = 200

[[redirects]]
  from = "/playlist/*"
  to = "/.netlify/functions/api/playlist/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 3. 兜底路由
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
